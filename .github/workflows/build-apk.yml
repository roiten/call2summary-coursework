# Cloud build (no local Rust/NDK needed): push this project to a GitHub repo,
# run "Actions -> Build debug APK -> Run workflow", download the artifact.
# NOT verified by the author of this project.
name: Build debug APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - run: cargo install --locked --version 4.1.2 cargo-ndk
      - name: Native libs + Kotlin bindings
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./build_native.sh
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gigastt-demo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
